# FoodExpress: sistema completo
# Uso: cp .env.example .env && docker compose up --build
#
# Puertos publicados al host (justificación: docs/adr/ADR-018-puertos-expuestos.md):
#   3000   frontend           (la web: http://localhost:3000)
#   8081   restaurantes-menu  (API: pruebas con Postman y /actuator/health)
#   8082   pedidos            (API: pruebas con Postman y /actuator/health)
#   8083   notificaciones     (API + WebSocket /ws + panel.html)
#   127.0.0.1:5432   postgres        (solo local: DBeaver/IntelliJ en desarrollo)
#   127.0.0.1:5672   rabbitmq AMQP   (solo local: correr un servicio desde el IDE)
#   127.0.0.1:15672  rabbitmq panel  (solo local: monitoreo de colas y DLQ)
#
# Redes (justificación: docs/adr/ADR-017-redes-docker-compose.md):
#   datos       servicios <-> PostgreSQL
#   mensajeria  servicios <-> RabbitMQ
#   servicios   HTTP entre contenedores (nginx -> servicios, pedidos -> restaurantes-menu)
services:

  postgres:
    image: postgres:16
    container_name: foodexpress-postgres
    environment:
      POSTGRES_USER: ${DB_USER:?Falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea las 3 bases de datos la primera vez que arranca
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: foodexpress-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Falta RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - mensajeria
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  restaurantes-menu:
    build: ./backend/restaurantes-menu
    container_name: foodexpress-restaurantes-menu
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodexpress_restaurantes
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - datos
      - mensajeria
      - servicios
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  pedidos:
    build: ./backend/pedidos
    container_name: foodexpress-pedidos
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodexpress_pedidos
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # restaurantes-menu.url en application.properties
      RESTAURANTESMENU_URL: http://restaurantes-menu:8081
      PEDIDOS_IMPUESTO_TASA: ${PEDIDOS_IMPUESTO_TASA:-0.08}
    ports:
      - "8082:8082"
    networks:
      - datos
      - mensajeria
      - servicios
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Pedidos valida cada orden contra el menú (llamada síncrona)
      restaurantes-menu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  notificaciones:
    build: ./backend/notificaciones
    container_name: foodexpress-notificaciones
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodexpress_notificaciones
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8083:8083"
    networks:
      - datos
      - mensajeria
      - servicios
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: foodexpress-frontend
    ports:
      - "3000:80"
    networks:
      - servicios
    # nginx resuelve los nombres de los servicios al arrancar: deben estar sanos antes
    depends_on:
      restaurantes-menu:
        condition: service_healthy
      pedidos:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s    

networks:
  datos:        # servicios <-> PostgreSQL
  mensajeria:   # servicios <-> RabbitMQ
  servicios:    # llamadas HTTP entre microservicios (pedidos -> restaurantes-menu)

volumes:
  postgres-data:
  rabbitmq-data:
