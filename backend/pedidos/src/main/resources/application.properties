spring.application.name=pedidos
server.port=8082

# Conexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/foodexpress_pedidos
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
restaurantes-menu.url=http://localhost:8081

# Tasa de impuesto aplicada al subtotal (impoconsumo restaurantes: 8%)
pedidos.impuesto.tasa=0.08

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=2s

management.endpoints.web.exposure.include=health