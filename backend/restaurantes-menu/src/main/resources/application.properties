# Identificacion del microservicio
spring.application.name=restaurantes-menu
server.port=8081

# Conexion con PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/foodexpress_restaurantes
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=2s

management.endpoints.web.exposure.include=health