server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  # Cada ruta de la API va al microservicio que le corresponde.
  # Los nombres (restaurantes-menu, pedidos, notificaciones) son los servicios del docker-compose.
  location /api/restaurantes { proxy_pass http://restaurantes-menu:8081; }
  location /api/platos       { proxy_pass http://restaurantes-menu:8081; }
  location /api/pedidos      { proxy_pass http://pedidos:8082; }
  location /api/notificaciones { proxy_pass http://notificaciones:8083; }
  
  # WebSocket (STOMP) para actualizaciones en tiempo real
  location /ws {
    proxy_pass http://notificaciones:8083;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / { try_files $uri /index.html; }
}
